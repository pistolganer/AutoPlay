name: AutoPlay
options:
  bundleIdPrefix: com.rodrigo
  deploymentTarget:
    iOS: "17.0"
targets:
  AutoPlay:
    type: application
    platform: iOS
    sources:
      - AutoPlay
    info:
      path: AutoPlay/Info.plist
      properties:
        CFBundleDisplayName: AutoPlay
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: AutoPlay usa tu ubicación para mostrarte en el mapa y guiarte hasta tu destino.
        NSAppleMusicUsageDescription: AutoPlay muestra y controla la canción que está sonando.
        NSMicrophoneUsageDescription: AutoPlay usa el micrófono para los comandos de voz.
        NSSpeechRecognitionUsageDescription: AutoPlay entiende tus comandos de voz, como «llévame a casa».
        NSPhotoLibraryUsageDescription: AutoPlay usa tus fotos para poner los iconos que elijas.
        LSApplicationQueriesSchemes:
          - spotify
          - comgooglemaps
          - waze
          - music
          - whatsapp
          - podcasts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rodrigo.autoplay
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
